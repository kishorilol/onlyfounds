<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Statics/CSS/all.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="logo" href="Homepage.html"><span class="logo-badge">OF</span>OnlyFounds</a>
            <a class="header-link" href="register.html">Create account</a>
        </div>
    </header>
    <main>
        <section class="auth-card">
            <div class="pin"></div>
            <div class="stamp">Members</div>
            <h2>Login</h2>
            <p class="sub">Welcome back, Enter your detail and continue</p>

            <div class="alert" id="formAlert" role="alert"></div>

            <form id="loginForm" novalidate>

                <div class="field" id="f-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
                    <div class="field-error">Enter a valid email address</div>
                </div>

                <div class="field" id="f-password">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
                    </div>
                    <div class="field-error">Enter your password.</div>
                </div>

                <div class="row-between">
                    <label class="check"><input type="checkbox" id="remember">Keep me logged in</label>
                    <a class="link" href="forgot.html"></a>
                </div>

                <button class="submit-btn" type="submit" id="submitBtn"></button>
            </form>
            <div class="perforation">
                <span>New Here? <a href="register.html">Create an account</a></span>
            </div>
        </section>
    </main>
</body>
</html>
